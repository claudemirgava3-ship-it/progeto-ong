<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro - ONG Transformando Vidas</title>
    <link rel="stylesheet" href="../css/style.css">
</head>

<body>

    <header>
        <h1>Cadastro</h1>

        <button
            class="menu-hamburguer"
            id="menuHamburguer"
            type="button"
            aria-controls="menuNavegacao"
            aria-expanded="false">
            ☰ Menu
        </button>

        <nav id="menuNavegacao" aria-label="Navegação principal">
            <a href="index.html" data-page="inicio">
                Início
            </a>

            <a href="projetos.html" data-page="projetos">
                Projetos Sociais
            </a>

            <a href="cadastro.html" data-page="cadastro" aria-current="page">
                Cadastro
            </a>
        </nav>

        <button
            type="button"
            id="alternarContraste"
            aria-pressed="false">
            Alto contraste
        </button>
    </header>

    <main class="grid-container">

        <section id="cadastro">
            <h2>Faça parte da nossa ONG</h2>

            <p>
                Preencha o formulário abaixo para participar
                das nossas ações e projetos sociais.
            </p>

            <form id="formCadastro" novalidate>

                <fieldset>
                    <legend>Dados pessoais</legend>

                    <label for="nome">
                        Nome completo:
                    </label>

                    <input
                        type="text"
                        id="nome"
                        name="nome"
                        autocomplete="name"
                        required>

                    <br>

                    <label for="cpf">
                        CPF:
                    </label>

                    <input
                        type="text"
                        id="cpf"
                        name="cpf"
                        placeholder="000.000.000-00"
                        pattern="[0-9]{3}\.[0-9]{3}\.[0-9]{3}-[0-9]{2}"
                        inputmode="numeric"
                        required>

                    <br>

                    <label for="email">
                        E-mail:
                    </label>

                    <input
                        type="email"
                        id="email"
                        name="email"
                        autocomplete="email"
                        required>

                    <br>

                    <label for="telefone">
                        Telefone:
                    </label>

                    <input
                        type="tel"
                        id="telefone"
                        name="telefone"
                        placeholder="(00) 00000-0000"
                        pattern="\([0-9]{2}\) [0-9]{5}-[0-9]{4}"
                        autocomplete="tel"
                        inputmode="tel"
                        required>
                </fieldset>

                <fieldset>
                    <legend>Endereço</legend>

                    <label for="cep">
                        CEP:
                    </label>

                    <input
                        type="text"
                        id="cep"
                        name="cep"
                        placeholder="00000-000"
                        pattern="[0-9]{5}-[0-9]{3}"
                        autocomplete="postal-code"
                        inputmode="numeric"
                        required>

                    <br><br>

                    <label for="endereco">
                        Endereço:
                    </label>

                    <input
                        type="text"
                        id="endereco"
                        name="endereco"
                        autocomplete="street-address"
                        required>
                </fieldset>

                <fieldset id="voluntariado">
                    <legend>Forma de participação</legend>

                    <label for="participacao">
                        Como deseja colaborar?
                    </label>

                    <select
                        id="participacao"
                        name="participacao"
                        required>

                        <option value="">
                            Selecione
                        </option>

                        <option value="voluntario">
                            Voluntariado
                        </option>

                        <option value="doador">
                            Doação
                        </option>
                    </select>
                </fieldset>

                <br>

                <button type="submit">
                    Enviar cadastro
                </button>

            </form>
        </section>

    </main>

    <footer>
        <p>&copy; 2026 ONG Transformando Vidas.</p>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script type="module" src="../js/main.js"></script>

</body>

</html>
